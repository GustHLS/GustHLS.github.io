<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/static/style.css">
    <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>

    <title>Gustavo Santinho</title>
</head>
<body>
    <nav class="sidebar close">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="assets/imgs/foto-perfil.jpeg" alt="">
                </span>

                <div class="text logo-text">
                    <span class="name">Gustavo Santinho</span>
                    <span class="profession">Full-Stack Developer</span>
                </div>
            </div>

            <i class='bx bx-chevron-right toggle'></i>
        </header>

        <div class="menu-bar">
            <div class="menu">

                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="#top">
                            <i class='bx bx-home-alt icon' ></i>
                            <span class="text nav-text">Home</span>
                        </a>
                    </li>

                    <li class="nav-link">
                        <a href="#about">
                            <i class='bx bx-user icon'></i>
                            <span class="text nav-text">About</span>
                        </a>
                    </li>

                    <li class="nav-link">
                        <a href="#resume">
                            <i class='bx bx-file-blank icon'></i>
                            <span class="text nav-text">Skills</span>
                        </a>
                    </li>

                    <li class="nav-link">
                        <a href="#projects">
                            <i class='bx bx-folder icon' ></i>
                            <span class="text nav-text">Projects</span>
                        </a>
                    </li>

                    <li class="nav-link">
                        <a href="#footer">
                            <i class='bx bx-envelope icon' ></i>
                            <span class="text nav-text">Contact</span>
                        </a>
                    </li>

                </ul>
            </div>

            <div class="bottom-content">
                <li class="mode">
                    <div class="sun-moon">
                        <i class='bx bx-moon icon moon'></i>
                        <i class='bx bx-sun icon sun'></i>
                    </div>
                    <span class="mode-text text">Dark mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>
                </li>
                
            </div>
        </div>

    </nav>

    <main class="home">
        <section id="top" class="text">
            <div class="container">
                <h2>Gustavo Henrique Lourenço Santinho</h2>
                <p>
                I'm 
                <span class="typed-container">
                    <span class="typed" data-typed-items="creating bugs since 2020., Full-Stack developer."></span>
                </span>
                </p>
            </div>
        </section>
    </main>

    <a href="#top" class="back-to-top">
        <i class='bx bx-up-arrow-alt'></i>
    </a>

    <script src="assets/script/script.js"></script>
</body>
</html>
